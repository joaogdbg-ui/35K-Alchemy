name: WIP 200-content QA (NO release)
on:
  push:
    branches:
      - 'wip/200-next-discoveries-authored'
permissions:
  contents: read
jobs:
  review-working-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy opencv-python-headless cairosvg pillow
      - name: Verify all current regression tests
        run: npm test
      - name: Audit all historical normalized names and recipe collisions
        run: node tools/audit-wip-v80-collisions.mjs
      - name: Verify entire existing catalog
        run: node tools/validate-v80.mjs
      - name: Verify WIP SVGs
        run: python tools/audit-v80-art.py
      - name: Verify IP screening and SVG source consistency
        run: node tools/audit-ip-safe-names.mjs && node tools/audit-active-artwork.mjs
      - name: Build complete OFFLINE HTML for validation ONLY
        run: python tools/build-standalone.py
      - name: Verify 200-element production policy remains mandatory
        run: node --test client/test/content-batch-200.test.mjs
