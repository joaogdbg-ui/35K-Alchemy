name: Build 35K Alchemy APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'ci/signing/**'
      - 'client/**'
      - 'shared/**'
      - 'tools/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '35K_Alchemy_V*_Offline.html'

permissions:
  contents: write

concurrency:
  group: alchemy-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate content release on exactly 200 new elements
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          BASE="$PREVIOUS_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse HEAD)"; fi
          node tools/check-content-batch-200.mjs --base "$BASE"
      - name: Require complete game source
        run: |
          test -f client/src/app.js
          test -f tools/build-standalone.py
          test -f shared/v69-approved.json
          test -f client/src/organic-art-v69.js
          test -f ci/signing/35k-alchemy-debug-keystore.b64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Install image QA dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless cairosvg pillow
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Screen public IP labels and current vector assets
        run: node tools/audit-ip-safe-names.mjs
      - run: npm run web:build
      - name: Create Capacitor project
        run: npx cap add android && npx cap sync android
      - name: Configure Android 16+ window insets and SystemBars
        run: python tools/configure-android-edge-to-edge.py
      - name: Add Google Mobile Ads rewarded TEST ads (AdMob sample IDs)
        run: python tools/configure-android-admob.py

      - name: Render original app launcher (all Android densities)
        run: python tools/generate-launcher-icons.py

      - name: Install persistent ALCH-ONLY test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          grep -v '^#' ci/signing/35k-alchemy-debug-keystore.b64 | tr -d '\n\r' | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /tmp/alchemy-key.txt
          grep -Fq 'B4:58:9E:5E:A8:9D:7B:0D:38:97:08:AA:F6:3D:D2:B3:88:B9:36:5F:0B:66:D2:AA:7C:BC:E4:00:47:DA:D5:2A' /tmp/alchemy-key.txt
          echo 'Verified dedicated 35K Alchemy DEBUG-only signing key'

      - name: Set increasing Android versionCode
        env:
          BUILD_NUMBER: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path('android/app/build.gradle')
          original = path.read_text(encoding='utf-8')
          code = int(os.environ['BUILD_NUMBER']) % 2000000000
          name = json.loads(Path('package.json').read_text(encoding='utf-8'))['version'] + '.' + str(code)
          updated, ncode = re.subn(r'(?m)^([ \t]*versionCode[ \t]+)\d+', lambda m: m.group(1) + str(code), original, count=1)
          updated, nname = re.subn(r'(?m)^([ \t]*versionName[ \t]+)["\'][^"\']+["\']', lambda m: m.group(1) + '"' + name + '"', updated, count=1)
          if ncode != 1 or nname != 1:
              raise SystemExit('Expected exactly one versionCode/versionName in android/app/build.gradle')
          # The Android build system may use its own auto-generated debug keystore.
          # Explicitly bind the debug buildType to 35K Alchemy's verified key.
          def inject_signing(m):
              indent = m.group(1)
              return (
                  indent + 'signingConfigs {\n'
                  + indent + '    alchemyDebug {\n'
                  + indent + '        storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")\n'
                  + indent + '        storePassword "android"\n'
                  + indent + '        keyAlias "androiddebugkey"\n'
                  + indent + '        keyPassword "android"\n'
                  + indent + '    }\n'
                  + indent + '}\n'
                  + indent + 'buildTypes {\n'
                  + indent + '    debug { signingConfig signingConfigs.alchemyDebug }'
              )
          updated, nsign = re.subn(r'(?m)^([ \t]*)buildTypes[ \t]*\{', inject_signing, updated, count=1)
          if nsign != 1:
              raise SystemExit('Could not force 35K Alchemy debug signingConfig')
          path.write_text(updated, encoding='utf-8')
          print('Android versionCode:', code, 'versionName:', name)
          PY

      - name: Compile signed Android APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Check signature and package, rename distributable APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/alchemy-apk-signature.txt
          grep -Fqi 'b4589e5ea89d7b0d389708aaf63dd2b388b9365f0b66d2aa7cbce40047dad52a' /tmp/alchemy-apk-signature.txt
          mkdir -p dist
          cp "$APK" dist/35K-Alchemy.apk
          test -s dist/35K-Alchemy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 35K-Alchemy-Android
          path: dist/35K-Alchemy.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish APK to stable latest URL
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 35K Alchemy — Android APK (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Official 35K Alchemy TEST build from commit ${{ github.sha }}.
            Download **35K-Alchemy.apk** and open it on your Android device.

            Package: com.joaogdbg.alchemy35k.
            Dedicated, stable 35K Alchemy debug-test certificate (NOT the Virtual Spectre certificate).
            Android debug versionCode = GitHub run ID modulo 2000000000 (monotonically increasing across workflows).
            This public debug signing key is NOT a production signing key.
            Rewarded ads use Google's TEST ad unit (labelled "Test Ad"): no real revenue. Server-side reward verification is not implemented.
            The first switch from the previous random debug-signed build may require reinstalling: back up saves first.
          files: dist/35K-Alchemy.apk
      - name: Remove obsolete app-debug.apk asset after publishing the new file
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest app-debug.apk --yes || true
