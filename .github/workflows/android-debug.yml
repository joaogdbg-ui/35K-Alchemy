name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require the complete V68 project
        run: |
          test -f client/src/app.js || (echo "Run Import full V68 source and build APK first"; exit 1)
          test -f tools/build-standalone.py
          test -f shared/v68-approved.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Install art audit Python dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless cairosvg pillow
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run web:build
      - run: npx cap add android && npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 35K-Alchemy-V68-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish tested APK at the stable latest release URL
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 35K Alchemy — Latest Android APK (debug)
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Automatic Android debug build of 35K Alchemy.
            Source commit: ${{ github.sha }}
            
            For Android: download **app-debug.apk** below, then open it to install.
            
            This is a testing APK, not a signed Play Store release.
            Rewarded AdMob ads and server-side reward verification are not implemented.
            Preserve/export your saved progress before replacing or reinstalling this build.
          files: android/app/build/outputs/apk/debug/app-debug.apk

