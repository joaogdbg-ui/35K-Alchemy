name: Import full V68 source and build APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned V68 source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f 35K_Alchemy_V68_GitHub_Import.tar.xz || (echo "Upload 35K_Alchemy_V68_GitHub_Import.tar.xz to repository root first"; exit 1)
          echo "24f348a349d0b5b8f26ebf99f12662bf17163e57cb6866287c2d35572c425c92  35K_Alchemy_V68_GitHub_Import.tar.xz" | sha256sum -c -
      - name: Import V68 source, preserving Git metadata and workflow
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf 35K_Alchemy_V68_GitHub_Import.tar.xz
          rm 35K_Alchemy_V68_GitHub_Import.tar.xz
          test -f client/src/app.js
          test -f tools/build-standalone.py
          test -f shared/v68-approved.json
          test ! -d android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import 35K Alchemy V68 game, assets, tests and history"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Run V68 regression suite
        run: npm test
      - name: Bundle and validate V68 HTML for Android
        run: npm run web:build
      - name: Create native Capacitor Android project
        run: npx cap add android && npx cap sync android
      - name: Assemble Android debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 35K-Alchemy-V68-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
