name: IP and catalog pre-merge QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'tools/**'
      - 'docs/**'
      - 'package.json'
      - 'HANDOFF_V76.md'
      - 'HANDOFF_V80.md'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/ip-audit-pr.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy opencv-python-headless cairosvg pillow
      - name: Require 200 newly authored elements for content PRs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/check-content-batch-200.mjs --base "$BASE_SHA"
      - run: npm test
      - run: node tools/validate-catalog.mjs
      - run: node tools/validate-v76.mjs
      - run: node tools/validate-v77.mjs
      - run: node tools/validate-v78.mjs
      - run: node tools/validate-v79.mjs
      - run: node tools/audit-ip-safe-names.mjs
      - run: node tools/audit-active-artwork.mjs
      - run: python tools/build-standalone.py
